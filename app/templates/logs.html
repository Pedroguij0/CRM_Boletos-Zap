{% extends "base.html" %}

{% block content %}
<div class="header">
    <div class="header-title">
        <h1>Histórico de Logs & Auditoria</h1>
        <p>Audite as rotinas de disparos diários, integrações do webhook e ações da LGPD.</p>
    </div>
</div>

<div class="panel">
    <div class="panel-header">
        <h2 class="panel-title">Fila de Logs Recentes</h2>
        <button class="btn btn-secondary" onclick="carregarLogs()" style="padding: 6px 12px; font-size: 12px;">Atualizar
            Lista</button>
    </div>

    <div class="timeline" id="logs-timeline-container" style="padding-top: 12px; padding-bottom: 24px;">
        <div style="color: var(--text-secondary); text-align: center; padding: 48px;">
            Carregando histórico de auditoria...
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        carregarLogs();
    });

    function carregarLogs() {
        fetch('/api/logs')
            .then(res => res.json())
            .then(logs => {
                const container = document.getElementById('logs-timeline-container');
                container.innerHTML = '';

                if (!Array.isArray(logs) || logs.length === 0) {
                    container.innerHTML = `
                        <div style="color:var(--text-muted);text-align:center;padding:48px;font-size:14px;display:flex;flex-direction:column;gap:8px;align-items:center;">
                            <svg width="48" height="48" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            <span>Nenhum log de auditoria registrado no sistema ainda.</span>
                        </div>
                    `;
                    return;
                }

                const reversedLogs = [...logs].reverse();

                reversedLogs.forEach(log => {
                    const statusClass = log.status === 'SUCESSO' ? 'success' : 'error';
                    const formattedDate = formatDate(log.data_hora);

                    let detailsHTML = '';
                    if (log.detalhes) {
                        detailsHTML = '<div style="margin-top: 8px; display:flex; flex-direction:column; gap:4px; font-family: monospace; font-size:11px; background-color:var(--bg-main); padding: 8px 12px; border-radius:6px; border: 1px solid var(--border);">';
                        if (typeof log.detalhes === 'object' && log.detalhes !== null) {
                            for (let [k, v] of Object.entries(log.detalhes)) {
                                detailsHTML += `<div><span style="color:var(--accent); font-weight:600;">${k}:</span> ${v}</div>`;
                            }
                        } else {
                            detailsHTML += `<div>${log.detalhes}</div>`;
                        }
                        detailsHTML += '</div>';
                    }

                    container.innerHTML += `
                        <div class="timeline-item">
                            <div class="timeline-dot ${statusClass}"></div>
                            <div class="timeline-content">
                                <div class="timeline-header">
                                    <span class="timeline-action">${log.acao}</span>
                                    <span class="timeline-time">${formattedDate}</span>
                                </div>
                                <div class="timeline-details">
                                    Status: <span class="badge ${log.status === 'SUCESSO' ? 'badge-success' : 'badge-danger'}" style="padding: 2px 6px; font-size:10px;">${log.status}</span>
                                    ${detailsHTML}
                                </div>
                            </div>
                        </div>
                    `;
                });
            })
            .catch(err => {
                console.error("Erro ao ler logs:", err);
                showToast("Erro ao conectar à API de Logs", "danger");
            });
    }
</script>
{% endblock %}
